name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release
      - name: Hotkey chord check
        run: .build/release/Hushtype --test-hotkey
      - name: Bundle
        run: |
          mkdir -p dist/Hushtype.app/Contents/MacOS dist/Hushtype.app/Contents/Resources
          cp .build/release/Hushtype dist/Hushtype.app/Contents/MacOS/
          cp Resources/Info.plist dist/Hushtype.app/Contents/
          cp Resources/AppIcon.icns dist/Hushtype.app/Contents/Resources/
          codesign --force --deep --sign - dist/Hushtype.app
          cd dist && ditto -c -k --keepParent Hushtype.app Hushtype.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hushtype.app
          path: dist/Hushtype.app.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hushtype.app.zip
          generate_release_notes: true
