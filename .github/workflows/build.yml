name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release
      - name: Hotkey chord check
        run: .build/release/Speakhold --test-hotkey
      - name: Bundle
        run: |
          mkdir -p dist/Speakhold.app/Contents/MacOS dist/Speakhold.app/Contents/Resources
          cp .build/release/Speakhold dist/Speakhold.app/Contents/MacOS/
          cp Resources/Info.plist dist/Speakhold.app/Contents/
          cp Resources/AppIcon.icns dist/Speakhold.app/Contents/Resources/
          codesign --force --deep --sign - dist/Speakhold.app
          cd dist && ditto -c -k --keepParent Speakhold.app Speakhold.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Speakhold.app
          path: dist/Speakhold.app.zip
